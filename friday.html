<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friday — Monikita’s Fitness App</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body data-day-slot="friday">
  <header>
    <h1>Monikita’s Fitness App 💪</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="advisor.html">What should I do today?</a>
    </nav>
  </header>
  <main>
    <h2>Friday</h2>
    <p id="workout-subtitle"></p>
    <div id="active-workout-label" class="day-top-note"></div>

    <div class="move-workout">
      <label for="swap-select">Do this workout instead today</label>
      <select id="swap-select"></select>
      <div class="move-workout-actions">
        <button type="button" id="open-selection-btn">Open selection</button>
        <button type="button" id="save-choice-btn">Save my choice</button>
        <button type="button" id="clear-choice-btn">Clear saved choice</button>
      </div>
    </div>

    <div id="daily-summary" class="summary"></div>
    <div id="workout-container"></div>
  </main>
</body>
</html>
