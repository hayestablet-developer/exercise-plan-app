<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Monikita’s Fitness App</title>
  <link rel="stylesheet" href="style.css?v=email-supabase-20260509">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js?v=email-supabase-20260509" defer></script>
</head>
<body class="auth-page">
  <header>
    <h1>Monikita’s Fitness App 💪</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="login.html">Sign in</a>
      <a href="advisor.html">Coach</a>
      <a href="exercises-library.html">Library</a>
      <a href="featured.html">Featured</a>
    </nav>
  </header>

  <main class="auth-shell">
    <section id="create-account-panel" class="auth-panel">
      <h2>Create account</h2>
      <p>Create your Supabase profile with an <strong>email address</strong> and password.</p>
      <div id="auth-message" class="auth-message"></div>
      <form id="create-account-form" class="auth-form">
        <label>Email
          <input id="create-email" name="email" type="email" autocomplete="email" placeholder="Your email" required>
        </label>
        <label>Password
          <input id="create-password" name="password" type="password" autocomplete="new-password" placeholder="Create a password" required minlength="6">
        </label>
        <button type="submit">Create account</button>
        <a class="button-like secondary" href="login.html">Already have an account? Sign in</a>
      </form>
    </section>
  </main>
</body>
</html>
