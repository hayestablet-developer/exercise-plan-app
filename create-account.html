<!DOCTYPE html><html><head><meta name='viewport' content='width=device-width,initial-scale=1'><title>Create Account</title><link rel='stylesheet' href='style.css'><script src='app.js' defer></script></head><body class='login-page'><main class='login-shell'><section class='login-hero'><div class='profile-badge'>Monikita’s Fitness App 💪</div><h1 style="margin:0 0 10px;font-size:clamp(2rem,8vw,3.6rem)">Create account</h1><p style="max-width:700px;color:rgba(255,255,255,.84)">Set up a user ID and password so your workouts, day swaps, sets, reps, and energy entries save to your own profile.</p><div id='login-message' class='login-message'></div><div class='login-grid'><form id='create-account-form' class='login-card'><h2>Create account</h2><label>User ID<input id='create-user-id' type='text' placeholder='Choose a user ID' autocomplete='username'></label><label>Password<input id='create-password' type='password' placeholder='Create a password' autocomplete='new-password'></label><button type='submit'>Create account</button><a class='button-link secondary' href='login.html' style='margin-top:10px;width:100%'>Already have an account? Sign in</a></form></div></section></main></body></html>
