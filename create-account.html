<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Monikita’s Fitness App</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js" defer></script>
</head>
<body class="auth-page">
  <header>
    <h1>Monikita’s Fitness App 💪</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="advisor.html">Coach</a>
      <a href="featured.html">Featured</a>
      <a href="account.html">Account</a>
    </nav>
  </header>
  <main class="auth-shell">
    <section class="auth-panel">
      <h2>Create account</h2>
      <p>This creates a real Supabase Auth user, not a browser-only account.</p>
      <div id="auth-message" class="auth-message"></div>
      <form id="create-account-form" class="auth-form">
        <label>Email <input id="create-email" type="email" autocomplete="email" required></label>
        <label>Password <input id="create-password" type="password" autocomplete="new-password" required minlength="6"></label>
        <button type="submit">Create account</button>
        <a class="button-like secondary" href="login.html">Already have an account? Sign in</a>
      </form>
    </section>
  </main>
</body>
</html>
