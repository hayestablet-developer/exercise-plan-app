<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunday — Rest — Monikita’s Fitness App</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body data-day-slot="sunday">
  <header>
    <h1>Monikita’s Fitness App 💪</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="advisor.html">What should I do today?</a>
    </nav>
  </header>
  <main>
    <h2 data-page-title="Sunday — Rest Day">Sunday — Rest Day</h2>
    <p>Use this day for complete rest or gentle movement like a walk or stretching. Focus on recovery: sleep, nutrition and mental relaxation.</p>
    <!-- Move workout section -->
    <div class="move-workout">
  <label for="swap-sunday">Do this workout instead today</label>
  <select id="swap-sunday" class="swap-select">
    <option value="">Choose a workout</option>
    <option value="monday.html" data-label="Lower Body A">Monday / Lower Body A</option>
    <option value="tuesday.html" data-label="Upper Push">Tuesday / Upper Push</option>
    <option value="wednesday.html" data-label="Recovery & Mobility">Wednesday / Recovery</option>
    <option value="thursday.html" data-label="Lower Body B">Thursday / Lower Body B</option>
    <option value="friday.html" data-label="Upper Pull + Shoulders & Triceps">Friday / Upper Pull</option>
    <option value="saturday.html" data-label="Sprints & Core">Saturday / Sprints & Core</option>
    <option value="sunday.html" data-label="Rest Day">Sunday / Rest</option>
    <option value="shoulders-triceps.html" data-label="Shoulders & Triceps">Shoulders & Triceps</option>
    <option value="featured.html" data-label="Featured Workouts">Featured Workouts</option>
  </select>
  <div class="swap-actions">
    <button type="button" class="swap-open-btn">Open selection</button>
    <button type="button" class="swap-save-btn">Save my choice</button>
    <button type="button" class="swap-clear-btn">Clear saved swap</button>
  </div>
  <div class="swap-status"></div>
</div><div class="original-workout">
<!-- Optional activities -->
    <div class="exercise">
      <h4>Gentle Walk</h4>
      <div class="fields">
        <label><input type="checkbox" data-key="sun-walk-complete"> Completed</label>
        <label>Duration (min): <input type="number" data-key="sun-walk-duration"></label>
        <label>Energy (1–10): <input type="number" data-key="sun-walk-energy" data-type="energy" min="1" max="10"></label>
        <label>Effort (1–10): <input type="number" data-key="sun-walk-effort" data-type="effort" min="1" max="10"></label>
      </div>
      <a href="https://www.youtube.com/results?search_query=benefits+of+walking" target="_blank">🎥 Video</a>
      <a href="https://www.google.com/search?tbm=isch&q=walking+exercise" target="_blank">🖼️ Images</a>
    </div>
    <div class="exercise">
      <h4>Stretching & Mobility</h4>
      <div class="fields">
        <label><input type="checkbox" data-key="sun-stretch-complete"> Completed</label>
        <label>Duration (min): <input type="number" data-key="sun-stretch-duration"></label>
        <label>Energy (1–10): <input type="number" data-key="sun-stretch-energy" data-type="energy" min="1" max="10"></label>
        <label>Effort (1–10): <input type="number" data-key="sun-stretch-effort" data-type="effort" min="1" max="10"></label>
      </div>
      <a href="https://www.youtube.com/results?search_query=full+body+stretch+routine" target="_blank">🎥 Video</a>
      <a href="https://www.google.com/search?tbm=isch&q=stretching+routine" target="_blank">🖼️ Images</a>
    </div>
    <!-- Summary -->
    <div id="daily-summary" class="summary"></div>
</div>
  </main>
</body>
</html>
