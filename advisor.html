<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What Should I Do Today? — Monikita’s Fitness App</title>
  <link rel="stylesheet" href="style.css?v=email-supabase-20260509">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js?v=email-supabase-20260509" defer></script>
</head>
<body>
  <header>
    <h1>Monikita’s Fitness App 💪</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="advisor.html">Coach</a>
      <a href="featured.html">Featured</a>
      <a href="account.html">Account</a>
    </nav>
  </header>
  <main>
    <h2>What Should I Do Today?</h2>
    <p>Use this advisor to select the best workout based on your recent activity, energy and recovery.</p>
    <div class="advisor-form">
      <label for="advisor-today">Today is (e.g. Monday, Tuesday):</label>
      <input type="text" id="advisor-today" placeholder="Day of week">

      <label for="advisor-last">Last workout (name or day):</label>
      <input type="text" id="advisor-last" placeholder="e.g. Lower A, Upper Push">

      <label for="advisor-missed">Missed workouts this week:</label>
      <input type="text" id="advisor-missed" placeholder="e.g. Friday, Sprint session">

      <label for="advisor-time">Time available today (minutes):</label>
      <input type="number" id="advisor-time" placeholder="30">

      <label for="advisor-energy">Current energy (1–10):</label>
      <input type="number" id="advisor-energy" min="1" max="10" value="5">

      <label for="advisor-effort">Desired effort (1–10):</label>
      <input type="number" id="advisor-effort" min="1" max="10" value="6">

      <label for="advisor-sick">Are you feeling sick or run down?</label>
      <select id="advisor-sick">
        <option value="no">No</option>
        <option value="yes">Yes</option>
      </select>

      <label for="advisor-fresh">Which feels fresher?</label>
      <select id="advisor-fresh">
        <option value="upper">Upper body</option>
        <option value="lower">Lower body</option>
      </select>
      
      <button type="button" onclick="recommendWorkout()">Get Recommendation</button>
    </div>
    <div id="advisor-result" class="advisor-result" style="display:none;"></div>
  </main>
</body>
</html>
