<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Monikita’s Fitness App</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js" defer></script>
</head>
<body class="auth-page">
  <header>
    <h1>Monikita’s Fitness App 💪</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="advisor.html">Coach</a>
      <a href="featured.html">Featured</a>
      <a href="account.html">Account</a>
    </nav>
  </header>
  <main class="auth-shell">
    <section class="auth-panel">
      <h2>Sign in</h2>
      <p>Use the email and password connected to your Supabase account. Your workouts save to the cloud.</p>
      <div id="auth-message" class="auth-message"></div>
      <form id="login-form" class="auth-form">
        <label>Email <input id="login-email" type="email" autocomplete="email" required></label>
        <label>Password <input id="login-password" type="password" autocomplete="current-password" required></label>
        <button type="submit">Sign in</button>
        <a class="button-like secondary" href="create-account.html">Create account</a>
        <button type="button" id="guest-login-btn" class="secondary">Continue as guest</button>
      </form>
    </section>
  </main>
</body>
</html>
