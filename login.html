<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Monikita’s Fitness App</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-hero-card">
      <div class="login-badge">Monikita’s Fitness App 💪</div>
      <h1>Sign in</h1>
      <p>Log in to save your workouts, day assignments, sets, reps, and energy. Need a profile first? Create one from the home page or use the button below.</p>
      <div id="login-message" class="login-message"></div>
      <div class="login-grid single-column">
        <form id="login-form" class="login-card">
          <h2>Welcome back</h2>
          <label>User ID
            <input id="login-user-id" type="text" placeholder="Your user ID" autocomplete="username">
          </label>
          <label>Password
            <input id="login-password" type="password" placeholder="Your password" autocomplete="current-password">
          </label>
          <button type="submit" class="button-link">Sign in</button>
          <a class="button-link secondary full-width center-link" href="create-account.html">Create account</a>
          <button type="button" id="guest-login-btn" class="button-link ghost full-width">Continue as guest</button>
          <p class="login-helper">Guest mode works, but no workout data is saved.</p>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
