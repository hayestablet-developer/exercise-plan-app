<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Monikita’s Fitness App</title>
  <link rel="stylesheet" href="style.css?v=email-supabase-20260509">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js?v=email-supabase-20260509" defer></script>
</head>
<body class="auth-page">
  <header>
    <h1>Monikita’s Fitness App 💪</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="advisor.html">Coach</a>
      <a href="exercises-library.html">Library</a>
      <a href="featured.html">Featured</a>
      <a href="account.html">Account</a>
    </nav>
  </header>

  <main class="auth-shell">
    <section class="auth-panel">
      <h2>Sign in</h2>
      <p>Log in with your <strong>email</strong> and password to save workouts, day assignments, sets, reps, and energy to Supabase.</p>
      <div id="auth-message" class="auth-message"></div>

      <form id="login-form" class="auth-form">
        <label>Email
          <input id="login-email" name="email" type="email" autocomplete="email" placeholder="Your email" required>
        </label>
        <label>Password
          <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Your password" required>
        </label>
        <button type="submit">Sign in</button>
        <a class="button-like secondary" href="create-account.html">Create account</a>
        <button type="button" id="guest-login-btn" class="secondary">Continue as guest</button>
      </form>

      <p class="auth-footnote">Guest mode works, but workout data is not saved.</p>
    </section>
  </main>
</body>
</html>
